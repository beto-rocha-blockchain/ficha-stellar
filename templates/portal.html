<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
{{refresh}}
<title>{{title}}</title>
<!-- The Wi-Fi portal of the free emergency minutes (portal.py fills it in).
     Nothing from another host and no script: the fonts and the logo come
     from this station, so it opens with no internet at all, in the sign-in
     window a phone opens by itself. -->
<link rel="icon" type="image/svg+xml" href="/static/brand/ficha-favicon.svg">
<style>
  @font-face { font-family: "Space Grotesk"; font-style: normal; font-weight: 400; font-display: swap; src: url("/static/fonts/space-grotesk-latin-400-normal.woff2") format("woff2"); }
  @font-face { font-family: "Space Grotesk"; font-style: normal; font-weight: 600; font-display: swap; src: url("/static/fonts/space-grotesk-latin-600-normal.woff2") format("woff2"); }
  @font-face { font-family: "Space Grotesk"; font-style: normal; font-weight: 700; font-display: swap; src: url("/static/fonts/space-grotesk-latin-700-normal.woff2") format("woff2"); }
  @font-face { font-family: "JetBrains Mono"; font-style: normal; font-weight: 500; font-display: swap; src: url("/static/fonts/jetbrains-mono-latin-500-normal.woff2") format("woff2"); }
  /* The station screen's palette (static/index.html), dark. */
  :root {
    color-scheme: dark;
    --background: #030911;
    --foreground: #eaeff3;
    --card: #09111a;
    --border: #1a2129;
    --muted-foreground: #95a0a9;
    --primary: #2ccceb;
    --success: #73d1ca;
    --warning: #ffb330;
    --destructive: #fc4447;
    --brand-lime: #66e619;
    --primary-rgb: 44 204 235;
    --success-rgb: 115 209 202;
    --warning-rgb: 255 179 48;
    --destructive-rgb: 252 68 71;
    --lime-rgb: 102 230 25;
    --font-display: "Space Grotesk", ui-sans-serif, system-ui, "Segoe UI", sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
    --radius: 4px;
    --radius-xl: 8px;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--background); color: var(--foreground); font-family: var(--font-display); font-size: 17px; line-height: 1.4; }
  .wrap { max-width: 32rem; margin: 0 auto; padding: 12px 16px 32px; display: flex; flex-direction: column; gap: 14px; }
  header { display: flex; align-items: center; gap: 12px; min-width: 0; }
  header img { height: 32px; width: auto; display: block; }
  .station { flex: 1; min-width: 0; color: var(--muted-foreground); font-size: 0.85rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lang { color: var(--primary); font-family: var(--font-mono); font-size: 0.8rem; text-decoration: none; border: 1px solid rgb(var(--primary-rgb) / .4);
          border-radius: var(--radius); padding: 6px 10px; white-space: nowrap; }
  h1, h2 { margin: 0; letter-spacing: -0.02em; line-height: 1.1; }
  h1 { font-size: 1.7rem; }
  h2 { font-size: 1.25rem; }
  .sub { margin: 6px 0 0; color: var(--muted-foreground); }
  .note { margin: 8px 0 0; color: var(--muted-foreground); font-size: 0.9rem; }
  .mono { font-family: var(--font-mono); font-size: 0.85em; }
  .num { font-variant-numeric: tabular-nums; }
  .sim { margin: 0; font-family: var(--font-mono); font-size: 0.75rem; letter-spacing: 0.06em; color: var(--warning);
         border: 1px dashed rgb(var(--warning-rgb) / .5); border-radius: var(--radius); padding: 8px 10px; }

  /* Emergency first, biggest: a number to call, one tap. */
  .sos { border: 2px solid var(--destructive); border-radius: var(--radius-xl); background: rgb(var(--destructive-rgb) / .1); padding: 14px; }
  .sos h1 { color: var(--destructive); text-transform: uppercase; letter-spacing: 0.04em; }
  .calls { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
  .call { display: flex; align-items: center; gap: 14px; text-decoration: none; color: #fff; background: var(--destructive);
          border-radius: var(--radius-xl); padding: 12px 16px; min-height: 64px; }
  .call svg { width: 28px; height: 28px; fill: currentColor; flex-shrink: 0; }
  .call b { font-size: 2.2rem; font-weight: 700; letter-spacing: -0.02em; line-height: 1; }
  .call span { font-size: 1.1rem; font-weight: 600; min-width: 0; overflow-wrap: anywhere; }

  .msg { margin: 0; border-radius: var(--radius-xl); padding: 12px 14px; font-weight: 600; }
  .msg.good { color: var(--brand-lime); border: 1px solid rgb(var(--lime-rgb) / .45); background: rgb(var(--lime-rgb) / .08); }
  .msg.warn { color: var(--warning); border: 1px solid rgb(var(--warning-rgb) / .45); background: rgb(var(--warning-rgb) / .08); }

  .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-xl); padding: 14px; }
  .free-row { margin-top: 12px; }
  .free-row form { margin: 0; }
  .free-btn { width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 56px; cursor: pointer;
              font: 700 1.15rem var(--font-display); color: var(--background); background: var(--brand-lime); border: 0; border-radius: var(--radius-xl); padding: 12px 16px; }
  .free-btn svg { width: 24px; height: 24px; fill: currentColor; flex-shrink: 0; }
  .free-btn:disabled { color: var(--muted-foreground); background: transparent; border: 1px solid var(--border); cursor: default; }
  .pay-btn { display: flex; align-items: center; justify-content: center; min-height: 56px; margin-top: 12px; text-decoration: none; text-align: center;
             font-weight: 700; font-size: 1.15rem; color: var(--background); background: var(--primary); border-radius: var(--radius-xl); padding: 12px 16px; }
  .safe ul { margin: 8px 0 0; padding-left: 1.2em; color: var(--muted-foreground); }
  .safe li { margin-top: 6px; }
  .safe li:first-child { color: var(--foreground); font-weight: 600; }
  a:focus-visible, button:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img src="/static/brand/ficha-logo.svg" alt="Ficha">
    <span class="station">{{station}}</span>
    <a class="lang" href="{{switch_url}}">{{switch}}</a>
  </header>
  {{simulated}}
  <section class="sos" aria-labelledby="sos">
    <h1 id="sos">{{sos_title}}</h1>
    <p class="sub">{{sos_sub}}</p>
    <div class="calls">{{calls}}</div>
  </section>
  {{message}}
  {{free}}
  {{pay}}
  {{safety}}
</div>
</body>
</html>
